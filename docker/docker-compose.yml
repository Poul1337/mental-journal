services:
  postgres:
    image: postgres:16-alpine
    container_name: mental-journal-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mental_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mental_journal}
      POSTGRES_DB: ${POSTGRES_DB:-mental_journal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mental_journal} -d ${POSTGRES_DB:-mental_journal}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
